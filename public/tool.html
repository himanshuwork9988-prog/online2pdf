<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Tool – Online2PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Use free online PDF tools to merge, split, rotate, compress and convert PDF files securely." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">← Online2PDF</a>
</header>

<section class="tool-wrap">

  <h1 id="toolTitle">PDF Tool</h1>

  <p class="tool-info">
    Upload your file, choose the required options and download the processed PDF instantly.
    All files are processed securely and deleted automatically.
  </p>

  <!-- UPLOAD -->
  <div class="upload-box" id="dropZone">
    <input type="file" id="fileInput" hidden multiple />
    <p>📂 Drag & drop files here</p>
    <span>or click to upload</span>
  </div>

  <!-- FILE PREVIEW -->
  <ul id="fileList" class="file-list"></ul>

  <!-- SPLIT OPTIONS -->
  <div id="splitOptions" class="option-box" style="display:none;">
    <label>Split pages (example: 1-3)</label>
    <input
      type="text"
      id="splitRange"
      placeholder="e.g. 1-3"
    />
  </div>

  <!-- ROTATE OPTIONS -->
  <div id="rotateOptions" class="option-box" style="display:none;">
    <label>Rotate by</label>
    <select id="rotateDegree">
      <option value="90">90°</option>
      <option value="180">180°</option>
      <option value="270">270°</option>
    </select>
  </div>

  <!-- IMAGE FORMAT -->
  <div id="imgFormatBox" class="option-box" style="display:none;">
    <label>Convert image to</label>
    <select id="imgFormat">
      <option value="png">PNG</option>
      <option value="jpg">JPG</option>
    </select>
  </div>

  <!-- PROCESS -->
  <button class="primary" onclick="runTool()">Process</button>

  <!-- PROGRESS -->
  <div class="progress" id="progress">
    <div class="bar" id="bar"></div>
  </div>

</section>

<footer class="footer">
  <p>© 2026 Online2PDF. All rights reserved.</p>
  <div>
    <a href="privacy.html">Privacy</a> |
    <a href="terms.html">Terms</a> |
    <a href="contact.html">Contact</a>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
